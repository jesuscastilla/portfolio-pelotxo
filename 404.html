<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · DiploTech</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--papel:#F7F5EF;--tinta:#1A231A;--tinta-suave:#5B6658;--verde:#70B060;--verde-oscuro:#4E8A3E}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Manrope",system-ui,sans-serif;background:var(--papel);color:var(--tinta);min-height:100vh;display:grid;place-items:center;padding:32px;line-height:1.6}
    .caja{max-width:560px;text-align:center}
    img{width:96px;margin:0 auto 26px;display:block}
    .ceja{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--verde-oscuro);margin-bottom:12px}
    h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:14px}
    p{color:var(--tinta-suave);margin-bottom:28px}
    .boton{display:inline-block;background:var(--verde-oscuro);color:#fff;text-decoration:none;font-weight:700;padding:13px 24px;border-radius:99px}
    .boton:hover{background:var(--verde)}
    .pie{margin-top:36px;font-size:.8rem;color:var(--tinta-suave)}
    .pie a{color:var(--verde-oscuro);text-decoration:none}
  </style>
</head>
<body>
  <main class="caja">
    <img src="/assets/logo.png" alt="DiploTech">
    <span class="ceja">Error 404</span>
    <h1>Esta página no existe.</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Vuelve al inicio y sigue navegando.</p>
    <a class="boton" href="/">Volver al inicio</a>
    <p class="pie">© 2026 Jesús Castilla · <a href="https://diplotech.es/">DiploTech</a></p>
  </main>
</body>
</html>
